<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SaleZone - Checkout</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .checkout-section {
            padding: 50px 8%;
            max-width: 1100px;
            margin: auto;
        }

        .checkout-title {
            text-align: center;
            font-size: 32px;
            color: #101828;
            margin-bottom: 35px;
        }

        #cartItems {
            display: grid;
            gap: 20px;
            margin-bottom: 25px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 25px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .cart-item img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .cart-info h3 {
            color: #101828;
            margin-bottom: 10px;
        }

        .cart-info p {
            margin-bottom: 10px;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
        }

        .quantity-box button,
        .remove-btn {
            border: none;
            padding: 7px 14px;
            background: #0077b6;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .remove-btn {
            background: #dc3545;
        }

        #cartTotal {
            font-size: 23px;
            font-weight: bold;
            color: #0077b6;
            text-align: right;
            margin: 25px 0;
        }

        #checkoutForm {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        #checkoutForm h2 {
            margin-bottom: 20px;
            color: #101828;
        }

        #checkoutForm input,
        #checkoutForm textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 15px;
        }

        #checkoutForm textarea {
            height: 110px;
            resize: vertical;
        }

        #checkoutForm button {
            width: 100%;
            padding: 14px;
            border: none;
            background: #0077b6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        #checkoutForm button:hover {
            background: #101828;
        }

        @media(max-width: 600px) {

            .cart-item {
                flex-direction: column;
                text-align: center;
            }

            #cartTotal {
                text-align: center;
            }

        }

    </style>

</head>

<body>


    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            Sale<span>Zone</span>
        </div>

        <a href="index.html" class="shop-btn">
            Continue Shopping
        </a>

    </nav>


    <!-- Checkout Section -->

    <section class="checkout-section">

        <h1 class="checkout-title">
            Your Shopping Cart
        </h1>


        <!-- Cart Products -->

        <div id="cartItems">

        </div>


        <!-- Total Price -->

        <h2 id="cartTotal">

        </h2>


        <!-- Customer Form -->

        <form id="checkoutForm" onsubmit="submitOrder(event)">

            <h2>Checkout Details</h2>


            <input

                type="text"

                id="customerName"

                placeholder="Enter Your Full Name"

                required

            >


            <input

                type="tel"

                id="customerPhone"

                placeholder="Enter Your Phone Number"

                required

            >


            <textarea

                id="customerAddress"

                placeholder="Enter Your Complete Address"

                required

            ></textarea>


            <button type="submit">

                Place Order

            </button>

        </form>

    </section>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
